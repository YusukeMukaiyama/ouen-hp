name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # bot/ はCloudflare Workers Builds側で独立にビルド・デプロイされる別デプロイ単位のため、
    # bot/配下だけの変更でサイトを再ビルドしない。
    paths-ignore:
      - "bot/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npm run build

      # 公開して問題ないファイルだけを配信用ディレクトリに集める。
      # リポジトリ直下をそのまま公開すると node_modules・scripts・package.json 等の
      # 内部ファイルまで ouen-hp.jp から取得可能になってしまうため。
      - name: Stage deployable files only
        run: |
          mkdir -p _site
          cp *.html _site/
          cp robots.txt sitemap.xml _site/
          cp -r dist images _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
